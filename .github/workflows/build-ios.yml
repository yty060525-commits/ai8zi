name: build-ios-ipad

on:
  workflow_dispatch: {}
  push:
    tags: [ 'ios-v*' ]

jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Rust (含 iOS 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: 生成 iOS 工程
        run: npx tauri ios init || echo "already initialized"

      - name: 构建模拟器 App(未签名,无证书)
        run: npx tauri ios build --target aarch64-sim --no-sign
        continue-on-error: false

      - name: 收拢产物并截图(自动验证“可启动”)
        if: always()
        run: |
          set -e
          mkdir -p ios-artifacts
          APP=$(find "$GITHUB_WORKSPACE/client/src-tauri/gen/apple/build" -name "*.app" | head -1)
          echo "app=$APP"
          if [ -n "$APP" ]; then
            cp -R "$APP" ios-artifacts/mingli.app
          fi
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/' || true)
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "com.apple.CoreSimulator.SimRuntime.iOS-17-5" 2>/dev/null || true)
          fi
          if [ -n "$APP" ] && [ -n "$DEVICE" ]; then
            xcrun simctl boot "$DEVICE" 2>/dev/null || true
            xcrun simctl install "$DEVICE" "$APP"
            BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
            xcrun simctl launch "$DEVICE" "$BUNDLE"
            sleep 8
            xcrun simctl io "$DEVICE" screenshot ios-artifacts/mingli-ios.png || true
          fi

      - name: 上传模拟器 App + 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mingli-ios-simulator
          path: client/ios-artifacts/

      - name: 构建真机 ipa(需 Secrets 证书)
        if: env.APPLE_CERT_B64 != ''
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERT_B64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          echo "$APPLE_CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
          APPLE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" npx tauri ios build

      - name: 上传真机 ipa
        if: env.APPLE_CERT_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: mingli-ios-device
          path: client/ios-artifacts-device/